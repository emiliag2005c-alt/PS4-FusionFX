name: Host tests

on:
  push:
  pull_request:

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run C discovery, profile validation, and Python tests
        run: sh tools/host_check.sh
