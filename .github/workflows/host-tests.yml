name: Host tests

on:
  push:
  pull_request:

jobs:
  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate default profile
        run: python tools/validate_profile.py profiles/default.json
      - name: Run tests
        run: python -m unittest discover -s tests -v
